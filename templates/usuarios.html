{% extends 'base.html' %}{% block content %}<div class="page-title"><div><span class="eyebrow">ADMINISTRAÇÃO</span><h1>Usuários e permissões</h1></div></div><section class="panel"><h3>Novo usuário</h3><form method="post" class="grid"><label>Nome<input name="nome" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha inicial<input type="password" name="senha" minlength="8" required></label><label>Perfil<select name="perfil">{% for x in perfis %}<option>{{x}}</option>{% endfor %}</select></label><label class="wide">Empresas com acesso<div class="check-list">{% for e in empresas %}<label><input type="checkbox" name="empresas" value="{{e.id}}"> {{e.nome}}</label>{% endfor %}</div></label><button>Cadastrar usuário</button></form></section><section class="panel"><h3>Usuários cadastrados</h3><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Empresas</th><th></th></tr></thead><tbody>{% for x in usuarios %}<tr><td>{{x.nome}}</td><td>{{x.email}}</td><td><span class="status">{{x.perfil}}</span></td><td>{{x.empresas or '—'}}</td><td>{% if x.id!=session.user_id %}<form method="post" action="/usuarios/{{x.id}}/excluir" onsubmit="return confirm('Excluir este usuário?')"><button class="danger small">Excluir</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
