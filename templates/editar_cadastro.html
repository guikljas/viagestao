{% extends 'base.html' %}{% block content %}<div class="page-title"><div><span class="eyebrow">CADASTROS</span><h1>Editar {{ 'motorista' if tipo=='motoristas' else 'veículo' }}</h1></div><a class="button light" href="/cadastros/{{tipo}}">Voltar</a></div><section class="panel"><form method="post" class="grid">{% if tipo=='motoristas' %}<label>Nome completo<input name="nome" value="{{registro.nome}}" required></label><label>Código interno<input name="codigo" value="{{registro.codigo or ''}}"></label><label>CPF<input name="cpf" value="{{registro.cpf or ''}}"></label><label>Telefone<input name="telefone" value="{{registro.telefone or ''}}"></label><label>E-mail<input type="email" name="email" value="{{registro.email or ''}}"></label><label>CNH<input name="cnh" value="{{registro.cnh or ''}}"></label>{% else %}<label>Placa<input name="placa" value="{{registro.placa|placa}}" maxlength="8" required></label><label>Código interno<input name="codigo" value="{{registro.codigo or ''}}"></label><label>Marca<input name="marca" value="{{registro.marca or ''}}"></label><label>Modelo / descrição<input name="modelo" value="{{registro.descricao or ''}}"></label><label>Tipo<input name="tipo" value="{{registro.tipo or ''}}"></label><label>Status<select name="status">{% for x in ['Ativo','Manutenção','Inativo'] %}<option {% if x==registro.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>{% endif %}<button>Salvar alterações</button></form></section>{% endblock %}
