{% extends 'base.html' %}{% block content %}<div class="page-title"><div><span class="eyebrow">CADASTROS</span><h1>Editar {{ 'motorista' if tipo=='motoristas' else 'veículo' }}</h1></div><a class="button light" href="{{ url_for('acesso_motoristas') if tipo=='motoristas' else url_for('acesso_veiculos') }}">Voltar</a></div><section class="panel"><form method="post" action="{{acao_formulario}}" class="grid"><input type="hidden" name="registro_id" value="{{registro.id}}">{% if tipo=='motoristas' %}<label>Nome completo<input name="nome" value="{{registro.nome}}" required></label><label>Código interno<input name="codigo" value="{{registro.codigo or ''}}"></label><label>CPF<input name="cpf" value="{{registro.cpf or ''}}"></label><label>Telefone<input name="telefone" value="{{registro.telefone or ''}}"></label><label>E-mail<input type="email" name="email" value="{{registro.email or ''}}"></label><label>CNH<input name="cnh" value="{{registro.cnh or ''}}"></label><label>Categoria da CNH<input name="categoria_cnh" value="{{registro.categoria_cnh or ''}}"></label><label>Validade da CNH<input type="date" name="validade_cnh" value="{{registro.validade_cnh or ''}}"></label><label>Status<select name="status">{% for x in ['Ativo','Inativo'] %}<option {% if x==registro.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label class="wide">Observações<textarea name="observacoes">{{registro.observacoes or ''}}</textarea></label>{% else %}<label>Placa<input name="placa" value="{{registro.placa|placa}}" maxlength="8" required></label><label>Código interno<input name="codigo" value="{{registro.codigo or ''}}"></label><label>Marca<input name="marca" value="{{registro.marca or ''}}"></label><label>Modelo / descrição<input name="modelo" value="{{registro.descricao or ''}}"></label><label>Ano<input type="number" name="ano" value="{{registro.ano or ''}}"></label><label>Tipo<input name="tipo" value="{{registro.tipo or ''}}"></label><label>Quilometragem atual<input type="number" step=".1" name="quilometragem" value="{{registro.quilometragem or ''}}"></label><label>Motorista principal<select name="motorista_id"><option value="">Não definido</option>{% for m in motoristas %}<option value="{{m.id}}" {% if registro.motorista_id==m.id %}selected{% endif %}>{{m.nome}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for x in ['Ativo','Manutenção','Inativo'] %}<option {% if x==registro.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>{% endif %}<button>Salvar alterações</button></form></section>{% endblock %}
